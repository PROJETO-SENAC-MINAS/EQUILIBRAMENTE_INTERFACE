<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/login.css">

<body>
    <div class="login-usuario">
        <div class="centralizar-imagem">

        </div>
        <h1 class="titulo">Cadastro</h1>

        <div class="conteudo-login">
            <form class="formulario" action="/login" method="POST">
                <label for="email">Email:</label>
                <input class="input" type="email" id="emailPaciente" name="email" required>

                <label for="nome de usuario">nome de usuario:</label>
                <input class="input"  type="password" id="senhaPaciente" name="senhaPaciente" required>

                <label for="Telefone">Telefone:</label>
                <input class="input"  type="password" id="senhaPaciente" name="senhaPaciente" required>

                <label for="CPF">CPF:</label>
                <input class="input"  type="password" id="senhaPaciente" name="senhaPaciente" required>

                <label for="senha">Senha:</label>
                <input class="input"  type="password" id="senhaPaciente" name="senhaPaciente" required>

                <label for="confirmar senha">Confirmar Senha:</label>
                <input class="input"  type="password" id="senhaPaciente" name="senhaPaciente" required>


                <div class="dados">
                
                <button onclick="validarPaciente()" class="entrar" type="submit">Entrar</button>
    </div>

</body>
</html>
