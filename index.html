<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title>login</title>
</head>
<body>
    <div class="login-usuario">
        <div class="centralizar-imagem">
            <div class="paciente">
                <img src="/img/aluna_imagem.png" alt="paciente" class="paciente">
            </div>
        </div>
        <h1 class="titulo">Acesso do Paciente</h1>

        <div class="conteudo-login">
            <form onsubmit="validarPaciente(event)" class="formulario">
                <label for="email">Email:</label>
                <input class="input" type="email" id="emailPaciente" name="email" required>
            
                <label for="senha">Senha:</label>
                <input class="input" type="password" id="senhaPaciente" name="senhaPaciente" required>
            
                <div class="dados">
                    <input class="checkbox" type="checkbox">Lembrar usuário
                    <a class="esqueci-senha" href="">Esqueci a senha</a>
                </div>
            
                <button  class="entrar" type="submit">
                    Entrar
                </button>
            </form>
            <p class="registre-se">Não tem uma conta? <a href="/register">Registre-se aqui</a></p>
        </div>
        <div class="acesso">
            <a class="acesso-psicologo" href="login_piscologo.html">Acesso Psicólogo</a>
        </div>
    </div>
    <script src="./js/login.js"></script>
</body>
</html>
